name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nest-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand src/app.controller.spec.ts
      - run: npm test -- --runInBand src/auth/dto/register.dto.spec.ts

  python-llm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q python-service/app python-service/main.py
      - run: PYTHONPATH=python-service python -m unittest discover -s python-service/tests -p "test_*.py"

  production-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
      - run: docker build --target runtime --tag robia-backend:test .
      - run: docker build --tag robia-ai-engine:test ./python-service
