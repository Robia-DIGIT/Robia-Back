name: robia-backend

services:
  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env.production
    networks:
      - supabase
    restart: "no"
    security_opt:
      - no-new-privileges:true

  ai-engine:
    build:
      context: ./python-service
    env_file:
      - .env.production
    expose:
      - "8000"
    networks:
      - egress
      - internal
    restart: unless-stopped
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4g

  backend:
    build:
      context: .
      target: runtime
    env_file:
      - .env.production
    environment:
      AI_ENGINE_URL: http://ai-engine:8000
      PORT: "3001"
      ODC_UPLOAD_DIR: /data/odc-uploads
    expose:
      - "3001"
    networks:
      internal:
      supabase:
        aliases:
          - robia-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # RC-33 hardening — a real ODC upload previously had nowhere durable to
    # land: no volume existed, and the container's read_only root filesystem
    # made even a fallback default (var/odc-uploads under the app's own,
    # read-only WORKDIR) silently fail on write. A named volume stays
    # writable regardless of read_only: true, and survives container
    # recreation (`docker compose up -d --build`) unlike the tmpfs above.
    volumes:
      - robia_odc_uploads:/data/odc-uploads
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

networks:
  egress:
    driver: bridge
  internal:
    internal: true
  supabase:
    external: true
    name: supabase_default

volumes:
  robia_odc_uploads:
