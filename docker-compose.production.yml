name: robia-backend

services:
  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env.production
    networks:
      - supabase
    restart: "no"
    security_opt:
      - no-new-privileges:true

  ai-engine:
    build:
      context: ./python-service
    env_file:
      - .env.production
    expose:
      - "8000"
    networks:
      - egress
      - internal
    restart: unless-stopped
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4g

  backend:
    build:
      context: .
      target: runtime
    env_file:
      - .env.production
    environment:
      AI_ENGINE_URL: http://ai-engine:8000
      PORT: "3001"
    expose:
      - "3001"
    networks:
      internal:
      supabase:
        aliases:
          - robia-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

networks:
  egress:
    driver: bridge
  internal:
    internal: true
  supabase:
    external: true
    name: supabase_default
